# MRIxFields early-stopping recipe with explicit approved dataset adaptations.
experiment:
  output_dir: runs
  seed: 2026
  name: multiq
data:
  root: data
  split: Images
  modality: T1W
  source_field: source
  target_field: target
  subject_ids: []
  orientation_axcodes: null
  target_normalization: null
  sampling_source_channel: 0
  training_pair_mask: intersection
  training_pair_mask_source_channel: 0
  inference_support_mask: source
  support_mask_source_channel: 0
  patch_size:
  - 96
  - 96
  - 96
  edge_probability: 0.5
  foreground_probability: 0.4
  foreground_threshold: 0.0
  spatial_flip_augmentation: none
  subject_balanced_batches: true
  num_workers: 0
  patches_per_subject: 256
model:
  architecture: unetpp
  in_channels: 1
  out_channels: 1
  base_channel: 0
  base_channels: 32
  levels: 5
  blocks_per_level: 2
  norm_groups: 1
  use_coordinates: true
  use_global_intensity: false
  output_mode: logit_residual
  residual_scale: 1.0
  logit_epsilon: 0.001
  zero_initialize_residual: true
  require_support_mask: true
  activation_checkpointing: false
loss:
  l1_weight: 1.0
  mse_weight: 0.5
  ssim_weight: 2.0
  gradient_weight: 0.1
  high_frequency_weight: 0.05
  foreground_weight: 0.0
  ssim_window: 11
  ssim_spatial_dims: 2
  ssim_data_range: 1.0
  mask_to_output_support: false
training:
  epochs: 120
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  weight_decay: 1.0e-05
  fused_optimizer: true
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  ema_decay: 0.995
  residual_gate_lr_multiplier: 0.25
  save_every: 1000
  save_last_every: 5
validation:
  patch_size:
  - 96
  - 96
  - 96
  overlap: 0.5
  sliding_window_batch_size: 4
  every: 5
  patience: 12
  early_stopping_min_epoch: 1
  min_delta: 0.0001
  before_training: true
  monitor: ssim
  compute_official_lpips: true
  official_perceptual_batch_size: 4
  full_volume_metrics: true
  save_full_prediction_every: 0
  save_prediction_slab: false
  slice_axis: 2
  slice_range: null
  raw_target_dir: null
  canonical_target_dir: null
  guard_monitor: full_ssim
  guard_tolerance: 0.002
  evaluation_mask: intersection
inference:
  sliding_window_batch_size: 32
  tta: none
protocol_source: mrixfields_n4clean_base_early_stopping
